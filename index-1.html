<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1b1f24);
    --hint: var(--tg-theme-hint-color, #6b7280);
    --card: var(--tg-theme-secondary-bg-color, #f2f4f7);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --good: #1e8f4e;
    --bad: #c62828;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: "Kantumruy Pro", "Noto Sans Khmer", system-ui, -apple-system, Roboto, sans-serif;
         line-height: 1.7; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 1.5rem; line-height: 1.4; margin: 0 0 6px; }
  h2 { font-size: 1.25rem; line-height: 1.5; margin: 12px 0 8px; }
  p { margin: 0 0 12px; }
  .hint { color: var(--hint); font-size: .92rem; }
  /* Khmer first, English underneath */
  .km { display: block; }
  .en { display: block; font-size: .85em; font-weight: 400; color: var(--hint); line-height: 1.45; margin-top: 2px; }
  .btn .en, .lesson .en { color: inherit; opacity: .75; }
  .lesson { display: flex; gap: 14px; align-items: center; width: 100%; text-align: left;
            background: var(--card); color: var(--text); border: 0; border-radius: 14px;
            padding: 14px; margin-top: 12px; font: inherit; cursor: pointer; }
  .lesson strong { display: block; font-size: 1.05rem; margin-bottom: 4px; }
  .btn { display: block; width: 100%; padding: 12px 14px; border: 0; border-radius: 12px;
         background: var(--btn); color: var(--btn-text); font: inherit; font-weight: 600;
         margin-top: 10px; cursor: pointer; }
  .btn.secondary { background: var(--card); color: var(--text); }
  .btn:focus-visible, .lesson:focus-visible, .opt:focus-visible { outline: 3px solid var(--btn); outline-offset: 2px; }
  .progress { height: 6px; background: var(--card); border-radius: 3px; overflow: hidden; margin-bottom: 18px; }
  .progress div { height: 100%; background: var(--btn); transition: width .25s; }

  .diamond { position: relative; width: 150px; aspect-ratio: 1; margin: 8px auto 16px;
             clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); background: #222; }
  .diamond.small { width: 56px; margin: 0; flex: none; }
  .diamond .face { position: absolute; inset: 4%;
             clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
             display: flex; flex-direction: column; align-items: center; justify-content: space-between;
             padding: 18% 0 12%; }
  .diamond .sym { font-size: 2.6rem; line-height: 1; }
  .diamond .num { font-weight: 800; font-size: 1.5rem; line-height: 1; font-family: system-ui, sans-serif; }
  .diamond.small .sym { font-size: 1rem; }
  .diamond.small .num { font-size: .7rem; }

  .examples { background: var(--card); border-radius: 12px; padding: 12px 14px; }
  .examples strong { display: block; }
  .opt { display: block; width: 100%; text-align: left; padding: 10px 14px; margin-top: 8px;
         border: 2px solid var(--card); border-radius: 12px; background: var(--bg);
         color: var(--text); font: inherit; cursor: pointer; }
  .opt.correct { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--bg)); }
  .opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--bg)); }
  .feedback { margin-top: 12px; font-weight: 600; }
  .score { font-size: 3rem; font-weight: 700; text-align: center; margin: 20px 0 4px; font-family: system-ui, sans-serif; }
  .center { text-align: center; }
  @media (prefers-reduced-motion: reduce) { .progress div { transition: none; } }
</style>
</head>

const UI = {
  appTitle:  { km: "វគ្គបណ្តុះបណ្តាលទំនិញគ្រោះថ្នាក់", en: "Dangerous Goods Training" },
  choose:    { km: "សូមជ្រើសរើសមេរៀន។ មេរៀននីមួយៗបញ្ចប់ដោយតេស្តខ្លីមួយ។", en: "Choose a lesson. Each lesson ends with a short quiz." },
  examples:  { km: "ឧទាហរណ៍", en: "Examples" },
  next:      { km: "បន្ទាប់", en: "Next" },
  startQuiz: { km: "ចាប់ផ្តើមធ្វើតេស្ត", en: "Start the quiz" },
  correct:   { km: "ត្រឹមត្រូវ!", en: "Correct!" },
  wrong:     { km: "មិនត្រឹមត្រូវទេ។ ចម្លើយត្រឹមត្រូវត្រូវបានបង្ហាញជាពណ៌បៃតង។", en: "Not quite. The correct answer is shown in green." },
  nextQ:     { km: "សំណួរបន្ទាប់", en: "Next question" },
  seeResult: { km: "មើលលទ្ធផល", en: "See my result" },
  result:    { km: "លទ្ធផលរបស់អ្នក", en: "Your result" },
  passed:    { km: "ល្អណាស់! អ្នកបានប្រឡងជាប់មេរៀននេះ។", en: "Well done. You passed this lesson." },
  failed:    { km: "សូមរំលឹកមេរៀនឡើងវិញ ហើយសាកល្បងម្តងទៀត។ អ្នកត្រូវការ ៧៥% ដើម្បីជាប់។", en: "Review the lesson and try again. You need 75% to pass." },
  retry:     { km: "ធ្វើតេស្តម្តងទៀត", en: "Try the quiz again" },
  review:    { km: "រំលឹកមេរៀនឡើងវិញ", en: "Review the lesson" },
  home:      { km: "ត្រឡប់ទៅមេរៀនទាំងអស់", en: "Back to all lessons" }
};

/* =========================================================
   4. APP LOGIC  (you do not need to change this part)
   ========================================================= */
function khNum(n) { return String(n).replace(/[0-9]/g, d => "០១២៣៤៥៦៧៨៩"[d]); }
function cls(n) { return { km: "ថ្នាក់ទី " + khNum(n), en: "Class " + n }; }
function t(x) { return `<span class="km">${x.km}</span><span class="en">${x.en}</span>`; }

const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }
const app = document.getElementById("app");
let backAction = null;

function setBack(fn) {
  backAction = fn;
  if (!tg || !tg.BackButton) return;
  fn ? tg.BackButton.show() : tg.BackButton.hide();
}
if (tg && tg.BackButton) tg.BackButton.onClick(() => backAction && backAction());

function haptic(type) {
  if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(type);
}

function diamond(key, small) {
  const l = LABELS[key];
  if (!l) return "";
  return `<div class="diamond${small ? " small" : ""}" role="img" aria-label="Hazard label ${l.num}">
    <div class="face" style="background:${l.bg};color:${l.ink}">
      <span class="sym">${l.sym}</span><span class="num">${l.num}</span></div></div>`;
}

function showHome() {
  setBack(null);
  app.innerHTML = `<h1>${t(UI.appTitle)}</h1><p class="hint">${t(UI.choose)}</p>` +
    LESSONS.map((l, i) => `<button class="lesson" onclick="showCard(${i},0)">
      ${diamond(l.icon, true)}<span>
      <strong>${t({ km: "មេរៀនទី " + khNum(i + 1) + "៖ " + l.title.km, en: "Lesson " + (i + 1) + ": " + l.title.en })}</strong>
      <span class="hint">${t(l.summary)}</span></span></button>`).join("");
}

function showCard(li, ci) {
  const lesson = LESSONS[li], card = lesson.cards[ci], n = lesson.cards.length, last = ci === n - 1;
  setBack(() => ci > 0 ? showCard(li, ci - 1) : showHome());
  app.innerHTML = `<div class="progress"><div style="width:${(ci + 1) / n * 100}%"></div></div>
    <p class="hint">${t({ km: "មេរៀនទី " + khNum(li + 1) + " · " + khNum(ci + 1) + " នៃ " + khNum(n),
                          en: "Lesson " + (li + 1) + " · " + (ci + 1) + " of " + n })}</p>
    ${diamond(card.label)}<h2>${t(card.title)}</h2><p>${t(card.text)}</p>
    ${card.examples ? `<div class="examples"><strong>${t(UI.examples)}</strong><p style="margin:8px 0 0">${t(card.examples)}</p></div>` : ""}
    <button class="btn" onclick="${last ? `startQuiz(${li})` : `showCard(${li},${ci + 1})`}">
      ${t(last ? UI.startQuiz : UI.next)}</button>`;
  window.scrollTo(0, 0);
}

let score = 0;
function startQuiz(li) { score = 0; showQuestion(li, 0); }

function showQuestion(li, qi) {
  const quiz = LESSONS[li].quiz, item = quiz[qi], n = quiz.length;
  setBack(() => showCard(li, LESSONS[li].cards.length - 1));
  app.innerHTML = `<div class="progress"><div style="width:${(qi + 1) / n * 100}%"></div></div>
    <p class="hint">${t({ km: "សំណួរទី " + khNum(qi + 1) + " នៃ " + khNum(n), en: "Question " + (qi + 1) + " of " + n })}</p>
    ${item.label ? diamond(item.label) : ""}<h2>${t(item.q)}</h2>
    <div id="opts">${item.options.map((o, i) =>
      `<button class="opt" onclick="answer(${li},${qi},${i})">${t(o)}</button>`).join("")}</div>
    <div id="after"></div>`;
  window.scrollTo(0, 0);
}

function answer(li, qi, chosen) {
  const quiz = LESSONS[li].quiz, item = quiz[qi], ok = chosen === item.answer;
  if (ok) score++;
  haptic(ok ? "success" : "error");
  document.querySelectorAll(".opt").forEach((b, i) => {
    b.disabled = true;
    if (i === item.answer) b.classList.add("correct");
    else if (i === chosen) b.classList.add("wrong");
  });
  const last = qi === quiz.length - 1;
  document.getElementById("after").innerHTML =
    `<p class="feedback" style="color:${ok ? "var(--good)" : "var(--bad)"}">${t(ok ? UI.correct : UI.wrong)}</p>
     <button class="btn" onclick="${last ? `showResult(${li})` : `showQuestion(${li},${qi + 1})`}">
      ${t(last ? UI.seeResult : UI.nextQ)}</button>`;
}

function showResult(li) {
  const total = LESSONS[li].quiz.length, pass = score / total >= 0.75;
  setBack(showHome);
  app.innerHTML = `<h1 class="center">${t(UI.result)}</h1><div class="score">${score} / ${total}</div>
    <p class="center">${t(pass ? UI.passed : UI.failed)}</p>
    <button class="btn" onclick="startQuiz(${li})">${t(UI.retry)}</button>
    <button class="btn secondary" onclick="showCard(${li},0)">${t(UI.review)}</button>
    <button class="btn secondary" onclick="showHome()">${t(UI.home)}</button>`;
}

showHome();
</script>
</body>
</html>
